{% extends "base.html" %}
{% block title %}System Initialization{% endblock %}
{% block bodyclass %}narrow skeuo-body{% endblock %}
{% block content %}
<section class="panel rack-unit">
  <div class="chassis-screws"><span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span></div>
  <div class="rack-header">
    <div class="unit-id"><span class="unit-badge">INIT</span> ANE-4000X APPLIANCE SETUP</div>
    <span class="status-lamp amber"></span>
  </div>
  <h1 class="embossed-title" style="font-size: 1.4rem;">CREATE ADMINISTRATOR</h1>
  <p class="muted small">INITIALIZE MASTER ADMINISTRATIVE PROFILE FOR AUTONOMOUS HEALING APPLIANCE.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>ADMIN USERNAME <input name="username" required minlength="3" maxlength="40" autocomplete="username" autofocus placeholder="admin"></label>
    <label>MASTER PASSWORD <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
      <small style="color: var(--text-dim);">Minimum 8 characters (scrypt encrypted)</small></label>
    <label>CONFIRM MASTER PASSWORD <input name="password2" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••"></label>
    <button class="tactile-btn lg" type="submit" style="margin-top: 10px;">
      <span class="btn-cap">INITIALIZE APPLIANCE ➔</span>
    </button>
  </form>
</section>
{% endblock %}
